[project]
name = "workout-bot"
version = "0.1.0"
description = "A workout bot built on the Claude Messages API."
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workout_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
