[project]
name = "local-model"
version = "0.1.0"
description = "Run and fine-tune AI models on a Colab GPU runtime, driven from this repo."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.scripts]
colab = "local_model.cli:main"
colab-bridge = "local_model.bridge_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    # The bridge server's own deps. Colab ships these; locally they're only needed for tests
    # and for running the bridge on your own machine.
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jupyter-client>=8",
    "ipykernel>=6.29",
    "matplotlib>=3.8",  # exercises the plot-capture path in tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_model"]

[tool.pytest.ini_options]
filterwarnings = [
    # Starlette's TestClient (used to drive the bridge in tests) nags about httpx usage.
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:You should not use the 'timeout' argument with the TestClient",
]
